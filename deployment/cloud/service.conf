[Unit]
Description=AlphaProject Lab cloud learning service
After=network-online.target
Wants=network-online.target

[Service]
Type=simple
User=alphaproject-lab
Group=alphaproject-lab
WorkingDirectory=/opt/alphaproject-lab/current
Environment=ALPHA_LAB_DB=/var/lib/alphaproject-lab/watchlist.sqlite3
Environment=ALPHA_LAB_PUBLIC_URL=https://8.155.130.86/lab
Environment=PYTHONDONTWRITEBYTECODE=1
LoadCredential=ai.json:/etc/alphaproject-lab/credentials/ai.json
LoadCredential=feishu.json:/etc/alphaproject-lab/credentials/feishu.json
ExecStart=/opt/alphaproject-lab/current/.venv/bin/python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 18010 --workers 1 --proxy-headers --forwarded-allow-ips=127.0.0.1 --limit-concurrency 40 --timeout-keep-alive 5
Restart=on-failure
RestartSec=5
TimeoutStopSec=90
UMask=0077
NoNewPrivileges=true
PrivateTmp=true
ProtectSystem=strict
ProtectHome=true
ReadWritePaths=/var/lib/alphaproject-lab
MemoryMax=384M
CPUQuota=80%
TasksMax=128

[Install]
WantedBy=multi-user.target
